:root{--bg:#f3f1fb;--surf:#fff;--ink:#1b1740;--mut:#6a6590;--line:#dcd8f0;--acc:#7a2bd9;--accink:#fff;--hd:#1b1740;--hdink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#110e26;--surf:#1d1942;--ink:#f0eefc;--mut:#a29dcb;--line:#2e2960;--acc:#b583ff;--accink:#150b2b;--hd:#1d1942;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:var(--hdink);padding:26px 16px 22px;border-radius:0 0 26px 26px}
.w{max-width:640px;margin:0 auto}
h1{font-size:32px;line-height:1.05;margin:0 0 6px;font-weight:900;letter-spacing:-.5px}
header p{margin:0;color:#cfc8f5;font-size:15px}
.main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px}

.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabs button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:9px;text-align:center}
.c img{width:100%;aspect-ratio:1;border-radius:12px;display:block;margin-bottom:9px}
.c b{display:block;font-size:15px;margin-bottom:9px}
.b{width:100%;padding:11px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.e{color:var(--mut);text-align:center;padding:30px 0}
#m{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#m.on{opacity:1}
